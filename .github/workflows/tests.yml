name: tests

on:
  # PRs are covered once by `pull_request`; `push` is scoped to main so the
  # merged tree is still verified without doubling every PR's checks.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Apex workers push repeatedly, and each push otherwise queues 8 more jobs.
# Supersede rather than accumulate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite list is derived from the tree, not hand-maintained. It used to be
  # a literal list, and two suites (apex-commits-ahead, apex-reap-pr-state) sat
  # in `tests/` never running on any PR — a test that does not run is worse than
  # no test, because it reads as coverage. Adding a `tests/*.test.sh` is now the
  # whole of wiring it up.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          suites=$(ls tests/*.test.sh \
            | sed 's|^tests/||; s|\.test\.sh$||' \
            | jq -R . | jq -sc .)
          # An empty matrix silently passes the whole workflow, which is the
          # same lie in a new place. Fail loudly instead.
          [ "$suites" != "[]" ] || { echo "no tests/*.test.sh found" >&2; exit 1; }
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "$suites"

  test:
    needs: discover
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One job per suite: apex-pair alone runs for minutes, and a matrix
        # names the failing suite directly in the checks UI.
        suite: ${{ fromJSON(needs.discover.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      # Every suite is `#!/usr/bin/env zsh` and uses zsh-only syntax
      # (${0:A:h:h}, setopt err_return, ${(qqq)…}, ${(f)…}) — bash is not a
      # fallback. jq parses the apex state fixtures. tmux is not strictly
      # needed (each suite puts a stub tmux on PATH) but the scripts probe for
      # the real binary in places, so install it rather than depend on that.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh tmux jq

      # en_US.UTF-8 — agent-icons compares Nerd Font glyphs, which need a
      # UTF-8 locale for zsh's pattern matching to line up.
      - name: Generate en_US.UTF-8 locale
        run: sudo locale-gen en_US.UTF-8

      - name: tests/${{ matrix.suite }}.test.sh
        run: zsh tests/${{ matrix.suite }}.test.sh
